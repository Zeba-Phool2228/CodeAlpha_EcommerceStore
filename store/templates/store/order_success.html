{% extends "store/base.html" %}

{% block content %}
<div class="text-center">
    <h2 class="text-success mb-3">✅ Order Placed Successfully!</h2>
    <p>Your order number is <strong>#{{ order.id }}</strong>.</p>
    <p>Total: Rs. {{ order.get_total_cost }}</p>
    <p>We will deliver to: {{ order.address }}, {{ order.city }}</p>
    <a href="{% url 'product_list' %}" class="btn btn-primary mt-3">Continue Shopping</a>
    <a href="{% url 'my_orders' %}" class="btn btn-outline-secondary mt-3">View My Orders</a>
</div>
{% endblock %}
