<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}CodeAlpha E-Commerce Store{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="{% url 'product_list' %}">CodeAlpha Store</a>

            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                <span class="text-light">Hi, {{ user.username }}</span>
                <a href="{% url 'my_orders' %}" class="btn btn-outline-light btn-sm">My Orders</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-outline-light btn-sm">Sign Up</a>
                {% endif %}
                <a href="{% url 'cart_detail' %}" class="btn btn-outline-light btn-sm">🛒 Cart</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
